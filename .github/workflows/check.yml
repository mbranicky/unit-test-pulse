name: Check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ["22.18.0", "24"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js ${{ matrix.node }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            npm-shrinkwrap.json
            tests/compat/vitest4/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Prepare Vitest 4 and Bun compatibility runtimes
        id: compat
        run: npm run setup:compat

      - name: Type check
        run: npm run typecheck

      - name: Type check minimum Paseo 0.11.2 SDK
        if: ${{ !cancelled() && steps.compat.outcome == 'success' }}
        run: npm run typecheck:paseo-011

      - name: Type check Paseo 0.13.1 and 0.13.2 SDKs
        if: ${{ !cancelled() && steps.compat.outcome == 'success' }}
        run: npm run typecheck:paseo-013

      - name: Type check Paseo 0.14.0 SDK
        if: ${{ !cancelled() && steps.compat.outcome == 'success' }}
        run: npm run typecheck:paseo-014

      - name: Verify publication gates without running release lifecycle scripts
        if: ${{ !cancelled() && steps.compat.outcome == 'success' }}
        run: |
          npm install --prefix "$RUNNER_TEMP/unit-test-pulse-publish-npm" --ignore-scripts --no-audit --no-fund npm@11.13.0
          PATH="$RUNNER_TEMP/unit-test-pulse-publish-npm/node_modules/.bin:$PATH" python3 -m unittest discover -s scripts -p 'test_npm_release.py'

      # Run both suites even if an earlier check fails, once setup succeeds.
      # Their failures still fail the job; cancellation stops further work.
      - name: Run all unit tests
        if: ${{ !cancelled() && steps.compat.outcome == 'success' }}
        run: npm test

      - name: Run all real-runner integration tests
        if: ${{ !cancelled() && steps.compat.outcome == 'success' }}
        run: npm run test:integration

      - name: Verify the production release package
        if: ${{ !cancelled() && steps.compat.outcome == 'success' }}
        run: npm run test:package
